<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@96,700&display=block">
<style>
  body{margin:0}
  .card{width:1200px;height:630px;box-sizing:border-box;padding:88px 96px;background:#F6F7F9;color:#172030;
    font-family:'Bricolage Grotesque',sans-serif;display:flex;flex-direction:column;justify-content:space-between}
  .wm{font:700 150px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.035em;white-space:nowrap;margin-left:-6px}
  .wm svg{height:.6em;width:1.275em;vertical-align:-.07em;margin:0 .015em}
  .line{font-size:52px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0;max-width:16em}
  .url{font-size:30px;color:#4A5568;margin:20px 0 0}
  .bar{display:flex;height:14px;margin:0 -96px -88px}
  .bar span{flex:1}
</style></head>
<body>
<!-- Social share image (1200×630). Rendered to PNG by render.mjs. -->
<div class="card" id="og">
  <span class="wm">everysp<svg viewBox="0 0 136 64"><circle cx="32" cy="32" r="30" fill="none" stroke="#172030" stroke-width="5"/><circle cx="32" cy="32" r="18" fill="none" stroke="#2F6FE4" stroke-width="14"/><circle cx="104" cy="32" r="30" fill="none" stroke="#172030" stroke-width="5"/><circle cx="104" cy="32" r="18" fill="none" stroke="#F4B400" stroke-width="14"/></svg>l</span>
  <div>
    <p class="line">How many spools do I need? Add your prints and find out.</p>
    <p class="url">everyspool.com</p>
  </div>
  <div class="bar"><span style="background:#2F6FE4"></span><span style="background:#F4B400"></span><span style="background:#D6336C"></span><span style="background:#0FA3A3"></span></div>
</div>
</body></html>
