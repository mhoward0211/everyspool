name: Suggest a feature
description: An idea that would make the calculator more useful
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
      placeholder: e.g. Let me upload a G-code file and read the filament amount automatically.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would you use it?
      description: What are you printing, and what's annoying about doing it now?
